x-app: &app
    build: .
    image: wallet-ledger-app
    volumes:
        - .:/var/www/html
        - vendor:/var/www/html/vendor
    environment:
        DB_HOST: mysql
        REDIS_HOST: redis
    depends_on:
        mysql:
            condition: service_healthy
        redis:
            condition: service_healthy

services:
    app:
        <<: *app
        ports:
            - "8000:8000"

    queue:
        <<: *app
        command: php artisan queue:work redis --tries=3

    scheduler:
        <<: *app
        command: php artisan schedule:work

    mysql:
        image: mysql:8.0
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
            MYSQL_DATABASE: wallet_ledger
        volumes:
            - mysql:/var/lib/mysql
            - ./docker/mysql/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
            interval: 5s
            retries: 20

    redis:
        image: redis:7-alpine
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            retries: 20

volumes:
    mysql:
    vendor:
